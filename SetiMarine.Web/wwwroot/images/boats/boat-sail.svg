<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="vwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a3d8f"/>
    </linearGradient>
    <linearGradient id="sail1g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="sail2g" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="vhull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="vshadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Água -->
  <rect x="0" y="210" width="400" height="70" fill="url(#vwater)"/>
  <path d="M0,215 C40,208 80,222 120,215 C160,208 200,222 240,215 C280,208 320,222 360,215 C380,211 395,218 400,215 L400,280 L0,280 Z" fill="#1565c0" opacity="0.5"/>
  <!-- Casco -->
  <path d="M100,185 Q200,195 300,185 L310,210 L90,210 Z" fill="url(#vhull)" filter="url(#vshadow)"/>
  <path d="M90,210 L310,210 L305,220 L95,220 Z" fill="#0a3d8f"/>
  <!-- Quilha -->
  <path d="M195,210 L205,210 L210,240 L190,240 Z" fill="#0d47a1"/>
  <!-- Mastro -->
  <line x1="200" y1="30" x2="200" y2="185" stroke="#607d8b" stroke-width="3"/>
  <!-- Vela principal -->
  <path d="M200,35 L200,175 L310,185 Z" fill="url(#sail1g)" stroke="#90caf9" stroke-width="1" opacity="0.95"/>
  <!-- Vela de proa (genoa) -->
  <path d="M200,45 L200,170 L110,180 Z" fill="url(#sail2g)" stroke="#90caf9" stroke-width="1" opacity="0.9"/>
  <!-- Estai -->
  <line x1="200" y1="35" x2="110" y2="185" stroke="#546e7a" stroke-width="1" opacity="0.5"/>
  <!-- Cabo da vela -->
  <line x1="200" y1="35" x2="310" y2="185" stroke="#546e7a" stroke-width="1" opacity="0.5"/>
  <!-- Boom -->
  <line x1="200" y1="175" x2="300" y2="182" stroke="#607d8b" stroke-width="2.5"/>
  <!-- Detalhe casco -->
  <line x1="100" y1="195" x2="300" y2="195" stroke="#29b6f6" stroke-width="1.5"/>
  <!-- Cockpit -->
  <ellipse cx="240" cy="188" rx="25" ry="6" fill="#1565c0" opacity="0.6"/>
  <!-- Reflexo -->
  <path d="M120,222 C160,228 240,228 280,222" stroke="#29b6f6" stroke-width="1" opacity="0.35" fill="none"/>
</svg>