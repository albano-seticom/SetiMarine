<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 160" width="350" height="160">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a3d8f"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="sd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
    <filter id="ss"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <!-- Água -->
  <rect x="0" y="105" width="350" height="55" fill="url(#sw)"/>
  <path d="M0,110 C35,103 70,117 105,110 C140,103 175,117 210,110 C245,103 280,117 315,110 C332,106 345,112 350,110 L350,160 L0,160 Z" fill="#1565c0" opacity="0.5"/>
  <!-- Casco -->
  <path d="M40,85 L310,85 L330,105 L20,105 Z" fill="url(#sh)" filter="url(#ss)"/>
  <path d="M20,105 L330,105 L320,113 L30,113 Z" fill="#0277bd"/>
  <!-- Deck -->
  <rect x="60" y="60" width="240" height="25" rx="3" fill="url(#sd)"/>
  <!-- Para-brisa -->
  <path d="M130,38 L230,38 L245,60 L115,60 Z" fill="#e1f5fe" opacity="0.8"/>
  <path d="M135,41 L225,41 L238,60 L122,60 Z" fill="#29b6f6" opacity="0.35"/>
  <!-- Motor popa -->
  <rect x="295" y="88" width="20" height="15" rx="2" fill="#455a64"/>
  <!-- Detalhe -->
  <line x1="60" y1="83" x2="300" y2="83" stroke="#4fc3f7" stroke-width="1.5"/>
  <!-- Reflexo água -->
  <path d="M60,115 C120,120 230,120 290,115" stroke="#29b6f6" stroke-width="1" opacity="0.3" fill="none"/>
